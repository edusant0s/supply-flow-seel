.mp-bars{display:grid;gap:10px}.mp-bar-row{display:grid;grid-template-columns:minmax(130px,1.1fr) 2fr 92px;gap:10px;align-items:center}.mp-bar-label{font-size:11px;font-weight:850;color:#456276;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mp-bar-track{height:12px;background:#e4edf2;border-radius:999px;overflow:hidden}.mp-bar-fill{height:100%;border-radius:999px;background:linear-gradient(90deg,#0a6d9d,#0b3553)}.mp-bar-value{text-align:right;font-size:11px;font-weight:900;color:var(--mp-navy)}.mp-scroll-bars{max-height:320px;overflow-y:auto;overflow-x:hidden;padding-right:6px}.mp-scroll-bars::-webkit-scrollbar{width:10px}.mp-scroll-bars::-webkit-scrollbar-track{background:#edf2f5;border-radius:999px}.mp-scroll-bars::-webkit-scrollbar-thumb{background:#b7c8d4;border-radius:999px}.mp-scroll-bars::-webkit-scrollbar-thumb:hover{background:#96adbc}
.mp-base-wrap{max-height:620px;overflow:auto;background:#fff;border:1px solid var(--mp-line);border-radius:18px;box-shadow:0 8px 22px rgba(15,53,80,.06)}
.mp-base-wrap table{min-width:1450px}.mp-base-wrap th{position:sticky;top:0;z-index:2}
.mp-base-wrap::-webkit-scrollbar,.kanban-premium-board::-webkit-scrollbar{width:10px;height:10px}.mp-base-wrap::-webkit-scrollbar-thumb,.kanban-premium-board::-webkit-scrollbar-thumb{background:#aebfca;border-radius:999px}
.mp-editor-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.mp-editor-card{background:#fff;border:1px solid var(--mp-line);border-radius:18px;padding:18px;box-shadow:0 8px 22px rgba(15,53,80,.06)}.mp-editor-card h3{margin:0 0 12px;color:var(--mp-navy)}.mp-editor-card textarea{min-height:230px}
.mp-editor-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:12px}
.mp-priority-badge{display:inline-flex;align-items:center;padding:5px 9px;border-radius:999px;font-size:10px;font-weight:950}.mp-priority-badge.urgent{background:#ffe2e2;color:#bd1e2c}.mp-priority-badge.normal{background:#e4efff;color:#165eb5}
.checkout-auto{background:#f3f7f9!important;color:#617989!important;cursor:not-allowed}
@media(max-width:1180px){.mp-toolbar-grid{grid-template-columns:repeat(3,1fr)}.mp-kpi-grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:850px){.mp-toolbar-grid,.mp-kpi-grid,.mp-chart-grid,.mp-editor-grid{grid-template-columns:1fr}.mp-bar-row{grid-template-columns:110px 1fr 76px}}
</style>
<script>
(function(){
  const PICKUP=['Solicitado','Em análise','Programado','Separado','Retirado/Entregue','Cancelado'];
  const DELIVERY=['Solicitado','Coleta','Em rota','Entregue'];
  const DEFAULT_EDITOR={
    labels:{
      requesterName:'Nome do solicitante',
      requesterEmail:'E-mail do solicitante',
      requesterPhone:'Telefone / WhatsApp',
      worksite:'Obra / Setor',
      priority:'Prioridade da solicitação'
    },
    worksites:(typeof OBRAS!=='undefined'&&Array.isArray(OBRAS)?OBRAS.slice():[])
  };
  window.mpKanbanFilters=window.mpKanbanFilters||{search:'',worksite:'',priority:'',light:''};
  window.mpDashboardFilters=window.mpDashboardFilters||{search:'',dateFrom:'',dateTo:'',phase:'',priority:'',light:'',type:'',worksite:''};

  function editor(){
    state.marketplaceEditor=state.marketplaceEditor||JSON.parse(JSON.stringify(DEFAULT_EDITOR));
    state.marketplaceEditor.labels=Object.assign({},DEFAULT_EDITOR.labels,state.marketplaceEditor.labels||{});
    state.marketplaceEditor.worksites=Array.isArray(state.marketplaceEditor.worksites)&&state.marketplaceEditor.worksites.length?state.marketplaceEditor.worksites:DEFAULT_EDITOR.worksites.slice();
    return state.marketplaceEditor;
  }
  function isWeekend(d){return d.getDay()===0||d.getDay()===6}
  function addBusinessDays(input,days){
    const d=new Date(input||Date.now()); d.setHours(12,0,0,0);
    let n=0; while(n<days){d.setDate(d.getDate()+1);if(!isWeekend(d))n++}
    return d.toISOString().slice(0,10);
  }
  function businessDiff(from,to){
    const a=new Date(from);const b=new Date(to);a.setHours(0,0,0,0);b.setHours(0,0,0,0);
    const sign=b>=a?1:-1;let cur=new Date(a),count=0;
    while((sign>0&&cur<b)||(sign<0&&cur>b)){cur.setDate(cur.getDate()+sign);if(!isWeekend(cur))count+=sign}
    return count;
  }
  function pickupStatus(o){return PICKUP.includes(o.status)?o.status:'Solicitado'}
  function deliveryStatus(o){
    const s=o.deliveryStatus||o.status;
    if(DELIVERY.includes(s))return s;
    if(s==='Retirado/Entregue')return 'Entregue';
    return 'Solicitado';
  }
  function phaseKey(o){return o.fulfillmentType==='entrega_obra'?'delivery:'+deliveryStatus(o):'pickup:'+pickupStatus(o)}
  function isFinal(o){
    return o.fulfillmentType==='entrega_obra'?deliveryStatus(o)==='Entregue':['Retirado/Entregue','Cancelado'].includes(pickupStatus(o));
  }
  function migrateOrder(o){
    if(!o.priority)o.priority='Normal';
    if(!o.deadline)o.deadline=addBusinessDays(o.createdAt||Date.now(),o.priority==='Urgente'?3:7);
    o.phaseTimes=o.phaseTimes||{};
    if(!o.phaseStartedAt&&!isFinal(o))o.phaseStartedAt=o.createdAt||new Date().toISOString();
    if(!o.phaseCurrent)o.phaseCurrent=phaseKey(o);
    if(isFinal(o)&&!o.completedAt)o.completedAt=o.withdrawalDateTime||o.deliveryCompletedAt||o.updatedAt||o.createdAt;
    return o;
  }
  function migrateAll(){editor();(state.orders||[]).forEach(migrateOrder);saveState()}
  window.migrateAll=migrateAll;
  function accumulate(o){
    migrateOrder(o);
    if(o.phaseStartedAt&&o.phaseCurrent){
      o.phaseTimes[o.phaseCurrent]=(Number(o.phaseTimes[o.phaseCurrent])||0)+Math.max(0,Date.now()-new Date(o.phaseStartedAt).getTime());
    }
  }
  function setPhase(id,status,type){
    const o=getOrder(id);if(!o)return toast('Pedido não encontrado.');
    accumulate(o);
    if(type==='delivery'||o.fulfillmentType==='entrega_obra'){
      o.deliveryStatus=status;o.status=status==='Entregue'?'Retirado/Entregue':status;
    }else{o.status=status}
    o.phaseCurrent=phaseKey(o);o.updatedAt=new Date().toISOString();
    if(isFinal(o)){o.phaseStartedAt='';o.completedAt=o.completedAt||o.updatedAt}else{o.phaseStartedAt=o.updatedAt}
    saveState();renderApp();toast('Fase atualizada.');
  }
  window.mpSetPickupPhase=(id,s)=>setPhase(id,s,'pickup');
  window.mpSetDeliveryPhase=(id,s)=>setPhase(id,s,'delivery');
  function phaseMs(o,key){
    migrateOrder(o);let ms=Number(o.phaseTimes[key]||0);
    if(o.phaseCurrent===key&&o.phaseStartedAt&&!isFinal(o))ms+=Math.max(0,Date.now()-new Date(o.phaseStartedAt).getTime());
    return ms;
  }
  function currentPhaseMs(o){return phaseMs(o,phaseKey(o))}
  function totalMs(o){const end=o.completedAt?new Date(o.completedAt).getTime():Date.now();return Math.max(0,end-new Date(o.createdAt||Date.now()).getTime())}
  function fmtMs(ms){
    ms=Math.max(0,Number(ms||0));const sec=Math.floor(ms/1000),d=Math.floor(sec/86400),h=Math.floor(sec%86400/3600),m=Math.floor(sec%3600/60);
    if(d)return d+'d '+h+'h '+m+'min';if(h)return h+'h '+m+'min';return m+'min';
  }
  function lightInfo(o){
    migrateOrder(o);
    if(isFinal(o))return {key:'finalizado',label:'Finalizado',cls:'mp-gray'};
    const diff=businessDiff(new Date(),new Date(o.deadline+'T12:00:00'));
    if(diff<0)return {key:'atraso',label:'Em atraso',cls:'mp-red'};
    if(diff<=1)return {key:'alerta',label:diff===0?'Vence hoje':'Em alerta',cls:'mp-yellow'};
    return {key:'prazo',label:'No prazo',cls:'mp-green'};
  }
  function totalQty(o){return (o.items||[]).reduce((a,c)=>a+Number(c.qty||0),0)}
  function totalValue(o){return (o.items||[]).reduce((a,c)=>{const i=getItem(c.itemId)||{};return a+Number(c.qty||0)*Number(i.price||0)},0)}
  function fmtMoney(v){try{return Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}catch(e){return 'R$ '+Number(v||0).toFixed(2)}}
  function pct(n,total){return total?((n/total)*100).toFixed(1).replace('.',',')+'%':'0,0%'}
  function optionList(arr,current){return arr.map(s=>'<option value="'+esc(s)+'" '+(s===current?'selected':'')+'>'+esc(s)+'</option>').join('')}
  function semaforoHtml(o){const l=lightInfo(o);return '<div class="mp-light '+l.cls+'"><span class="mp-dot"></span>'+l.label+'</div>'}
  function priorityHtml(o){const p=o.priority||'Normal';return '<span class="mp-priority-badge '+(p==='Urgente'?'urgent':'normal')+'">'+esc(p)+'</span>'}
  function card(o,type){
    migrateOrder(o);
    const isDel=type==='delivery';
    const st=isDel?deliveryStatus(o):pickupStatus(o);
    const phases=isDel?DELIVERY:PICKUP;
    const l=lightInfo(o);
    const itemNames=(o.items||[]).map(c=>((getItem(c.itemId)||{}).name||'Item')).filter(Boolean);
    const mainItem=itemNames[0]||'Material solicitado';
    const extraCount=Math.max(0,itemNames.length-1);
    const qty=totalQty(o);
    const qtyLabel=qty+' item(ns)';
    const stageLabel=esc(st||'Em andamento');
    const currentStateLabel=l.key==='finalizado'?'Processo encerrado':stageLabel;
    return '<div class="kanban-premium-card '+(isDel?'delivery-card ':'pickup-card ')+l.cls+'">'+
      '<div class="kanban-premium-cardtop">'+
        '<div class="kanban-head-main">'+
          '<div class="kanban-premium-code">'+esc(o.number||'PED')+'</div>'+
          '<div class="kanban-premium-name">'+esc(o.requesterName||'Solicitante')+'</div>'+
        '</div>'+
        '<span class="mp-stage-pill">'+stageLabel+'</span>'+
      '</div>'+
      '<div class="kanban-meta-list">'+
        '<div class="kanban-meta-item"><span class="meta-icon">&#127959;&#65039;</span><div class="meta-text"><b>Obra:</b><span class="meta-value">'+esc(o.worksite||'-')+'</span></div></div>'+
        '<div class="kanban-meta-item"><span class="meta-icon">&#128205;</span><div class="meta-text"><b>Destino:</b><span class="meta-value">'+esc(o.fulfillmentType==='entrega_obra'?(o.deliveryAddress||o.worksite||'-'):(o.worksite||'-'))+'</span></div></div>'+
      '</div>'+
      '<div class="mp-summary-line"><strong>'+qtyLabel+'</strong><span>'+esc(mainItem)+(extraCount>0?' +'+extraCount:'')+'</span></div>'+
      '<div class="kanban-chip-row">'+
        '<span class="kanban-chip money">'+fmtMoney(totalValue(o))+'</span>'+
        priorityHtml(o)+
        '<span class="kanban-chip signal '+l.cls+'"><span class="mp-dot"></span>'+esc(l.label||'No prazo')+'</span>'+
      '</div>'+
      '<div class="mp-deadline-row">'+
        '<span class="mp-deadline-left">Prazo: '+fmtDate(o.deadline)+'</span>'+
        '<span class="mp-deadline-right">'+currentStateLabel+'</span>'+
      '</div>'+
      '<div class="mp-timer-box">'+
        '<div class="mp-timer-row"><span>Na fase agora</span><b>'+stageLabel+'</b></div>'+
        '<div class="mp-timer-row"><span>Acumulado da fase</span><b data-live-phase="'+o.id+'">'+fmtMs(currentPhaseMs(o))+'</b></div>'+
        '<div class="mp-timer-row"><span>Tempo total</span><b data-live-total="'+o.id+'">'+fmtMs(totalMs(o))+'</b></div>'+
      '</div>'+
      '<label class="mp-phase-label">Fase da solicitação</label>'+
      '<select class="mp-phase-select" onchange="'+(isDel?'mpSetDeliveryPhase':'mpSetPickupPhase')+'('+o.id+',this.value)">'+optionList(phases,st)+'</select>'+
      '<div class="kanban-actions"><button class="btn-light single" onclick="openOrder('+o.id+')">Abrir detalhes</button></div>'+
    '</div>';
  }
  window.kcardPickupReal=o=>card(o,'pickup');
  window.kcardDeliveryReal=o=>card(o,'delivery');

  function filterOrders(list,filters,type){
    return (list||[]).filter(o=>{
      migrateOrder(o);const hay=[o.number,o.requesterName,o.requesterEmail,o.worksite,(o.items||[]).map(c=>(getItem(c.itemId)||{}).name).join(' ')].join(' ').toLowerCase();
      if(filters.search&&!hay.includes(filters.search.toLowerCase()))return false;
      if(filters.worksite&&o.worksite!==filters.worksite)return false;
      if(filters.priority&&o.priority!==filters.priority)return false;
      if(filters.light&&lightInfo(o).key!==filters.light)return false;
      if(type==='pickup'&&o.fulfillmentType==='entrega_obra')return false;
      if(type==='delivery'&&o.fulfillmentType!=='entrega_obra')return false;
      return true;
    })
  }
  function kanbanToolbar(){
    const f=window.mpKanbanFilters,e=editor();
    return '<div class="mp-toolbar"><div class="mp-toolbar-copy"><h3>Filtros do Kanban</h3><p>Localize e priorize as solicitações por obra, prioridade e semaforo.</p></div><div class="mp-toolbar-grid">'+
    '<label>Busca<input value="'+esc(f.search)+'" oninput="mpKanbanFilters.search=this.value;renderApp()" placeholder="Pedido, solicitante ou material"></label>'+
    '<label>Obra<select onchange="mpKanbanFilters.worksite=this.value;renderApp()"><option value="">Todas</option>'+e.worksites.map(x=>'<option '+(f.worksite===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'+
    '<label>Prioridade<select onchange="mpKanbanFilters.priority=this.value;renderApp()"><option value="">Todas</option><option '+(f.priority==='Normal'?'selected':'')+'>Normal</option><option '+(f.priority==='Urgente'?'selected':'')+'>Urgente</option></select></label>'+
    '<label>Semáforo<select onchange="mpKanbanFilters.light=this.value;renderApp()"><option value="">Todos</option><option value="atraso" '+(f.light==='atraso'?'selected':'')+'>Em atraso</option><option value="alerta" '+(f.light==='alerta'?'selected':'')+'>Em alerta</option><option value="prazo" '+(f.light==='prazo'?'selected':'')+'>No prazo</option><option value="finalizado" '+(f.light==='finalizado'?'selected':'')+'>Finalizado</option></select></label>'+
    '<button class="mp-btn-clear" onclick="mpKanbanFilters={search:\'\',worksite:\'\',priority:\'\',light:\'\'};renderApp()">Limpar</button></div></div>';
  }
  function col(status,orders,type){
    const active=orders.filter(o=>(type==='delivery'?deliveryStatus(o):pickupStatus(o))===status);
    const avg=active.length?active.reduce((a,o)=>a+currentPhaseMs(o),0)/active.length:0;
    return '<div class="kanban-premium-col"><div class="kanban-premium-colhead"><div class="kanban-premium-ic">'+(type==='delivery'?'&#128666;':'&#128230;')+'</div><div><div class="kanban-premium-title">'+esc(status)+'</div><div class="kanban-premium-colsub">Tempo médio: '+fmtMs(avg)+'</div></div><div class="kanban-premium-count">'+active.length+'</div></div>'+ (active.length?active.map(o=>card(o,type)).join(''):'<div class="kanban-empty">Nenhuma demanda nesta etapa.</div>')+'</div>';
  }
  window.kanbanRetiradaPedidos=function(){
    const orders=filterOrders(state.orders,window.mpKanbanFilters,'pickup');
    return '<div class="kanban-premium-wrap">'+kanbanToolbar()+'<div class="kanban-premium-header"><div><h2>Kanban de retirada</h2><div class="kanban-premium-sub">Semáforo, cronometros e selecao suspensa de fase.</div></div><span class="kanban-premium-pill">'+orders.length+' pedidos</span></div><div class="kanban-premium-board pickup">'+PICKUP.map(s=>col(s,orders,'pickup')).join('')+'</div></div>';
  };
  window.kanbanEntregaPedidos=function(){
    const orders=filterOrders(state.orders,window.mpKanbanFilters,'delivery');
    return '<div class="kanban-premium-wrap">'+kanbanToolbar()+'<div class="kanban-premium-header"><div><h2>Kanban de entrega SEEL</h2><div class="kanban-premium-sub">Semáforo, cronometros e selecao suspensa de fase.</div></div><span class="kanban-premium-pill">'+orders.length+' pedidos</span></div><div class="kanban-premium-board delivery">'+DELIVERY.map(s=>col(s,orders,'delivery')).join('')+'</div></div>';
  };
  window.kanbanPedidosComAbas=function(){
    const cur=window.adminKanbanTab||'retirada';
    return '<div class="kanban-premium-switch" style="margin-bottom:16px"><button class="'+(cur==='retirada'?'active':'')+'" onclick="adminKanbanTab=\'retirada\';renderApp()">Kanban Retirada</button><button class="'+(cur==='entrega'?'active':'')+'" onclick="adminKanbanTab=\'entrega\';renderApp()">Kanban Entrega SEEL</button></div>'+(cur==='entrega'?kanbanEntregaPedidos():kanbanRetiradaPedidos());
  };

  function groupBars(rows,total){
    if(!rows.length)return '<div class="empty">Sem dados para os filtros selecionados.</div>';
    const max=Math.max(1,...rows.map(r=>Number(r.value)||0));
    return '<div class="fluid-chart">'+rows.map((r,index)=>{
      const value=Number(r.value)||0;
      const target=Math.max(0,Math.min(100,(value/max)*100));
      const share=total?((value/total)*100):0;
      const label=esc(r.label);
      const shareText=share.toFixed(1).replace('.',',')+'%';
      return '<div class="fluid-bar-row" tabindex="0" style="--target:'+target.toFixed(2)+'%;--delay:'+(index*65)+'ms">'+
        '<div class="fluid-bar-label" title="'+label+'">'+label+'</div>'+
        '<div class="fluid-bar-track">'+
          '<button type="button" class="fluid-bar-fill" aria-label="'+label+': '+value+' ('+shareText+')" onclick="this.closest(\'.fluid-bar-row\').classList.toggle(\'selected\')"></button>'+
          '<div class="fluid-bar-tooltip">'+value+' • '+shareText+'</div>'+
        '</div>'+
        '<div class="fluid-bar-value">'+value+' | '+shareText+'</div>'+
      '</div>';
    }).join('')+'<div class="fluid-chart-note">Passe o cursor ou clique nas barras para destacar os valores.</div></div>';
  }
  function countGroup(list,keyFn){const m={};list.forEach(o=>{const k=keyFn(o)||'Não informado';m[k]=(m[k]||0)+1});return Object.entries(m).map(([label,value])=>({label,value})).sort((a,b)=>b.value-a.value)}
  function dashboardFiltered(){
    const f=window.mpDashboardFilters;
    return (state.orders||[]).filter(o=>{
      migrateOrder(o);const hay=[o.number,o.requesterName,o.requesterEmail,o.worksite].join(' ').toLowerCase();
      if(f.search&&!hay.includes(f.search.toLowerCase()))return false;
      const dt=(o.createdAt||'').slice(0,10);if(f.dateFrom&&dt<f.dateFrom)return false;if(f.dateTo&&dt>f.dateTo)return false;
      const ph=o.fulfillmentType==='entrega_obra'?deliveryStatus(o):pickupStatus(o);
      if(f.phase&&ph!==f.phase)return false;if(f.priority&&o.priority!==f.priority)return false;if(f.light&&lightInfo(o).key!==f.light)return false;
      const typ=o.fulfillmentType==='entrega_obra'?'Entrega SEEL':'Retirada na sede';if(f.type&&typ!==f.type)return false;if(f.worksite&&o.worksite!==f.worksite)return false;
      return true;
    })
  }
  function dashToolbar(){
    const f=window.mpDashboardFilters,e=editor(),phases=[...new Set(PICKUP.concat(DELIVERY))];
    return '<div class="mp-toolbar"><div class="mp-toolbar-copy"><h3>Filtros do Dashboard</h3><p>Todos os indicadores abaixo são recalculados pelos filtros.</p></div><div class="mp-toolbar-grid" style="grid-template-columns:1.4fr repeat(4,minmax(135px,1fr))">'+
    '<label>Busca<input value="'+esc(f.search)+'" oninput="mpDashboardFilters.search=this.value;renderApp()"></label>'+
    '<label>De<input type="date" value="'+esc(f.dateFrom)+'" onchange="mpDashboardFilters.dateFrom=this.value;renderApp()"></label>'+
    '<label>Até<input type="date" value="'+esc(f.dateTo)+'" onchange="mpDashboardFilters.dateTo=this.value;renderApp()"></label>'+
    '<label>Fase<select onchange="mpDashboardFilters.phase=this.value;renderApp()"><option value="">Todas</option>'+phases.map(x=>'<option '+(f.phase===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'+
    '<label>Prioridade<select onchange="mpDashboardFilters.priority=this.value;renderApp()"><option value="">Todas</option><option '+(f.priority==='Normal'?'selected':'')+'>Normal</option><option '+(f.priority==='Urgente'?'selected':'')+'>Urgente</option></select></label>'+
    '<label>Semáforo<select onchange="mpDashboardFilters.light=this.value;renderApp()"><option value="">Todos</option><option value="atraso" '+(f.light==='atraso'?'selected':'')+'>Em atraso</option><option value="alerta" '+(f.light==='alerta'?'selected':'')+'>Em alerta</option><option value="prazo" '+(f.light==='prazo'?'selected':'')+'>No prazo</option><option value="finalizado" '+(f.light==='finalizado'?'selected':'')+'>Finalizado</option></select></label>'+
    '<label>Atendimento<select onchange="mpDashboardFilters.type=this.value;renderApp()"><option value="">Todos</option><option '+(f.type==='Retirada na sede'?'selected':'')+'>Retirada na sede</option><option '+(f.type==='Entrega SEEL'?'selected':'')+'>Entrega SEEL</option></select></label>'+
    '<label>Obra<select onchange="mpDashboardFilters.worksite=this.value;renderApp()"><option value="">Todas</option>'+e.worksites.map(x=>'<option '+(f.worksite===x?'selected':'')+'>'+esc(x)+'</option>').join('')+'</select></label>'+
    '<button class="mp-btn-clear" onclick="mpDashboardFilters={search:\'\',dateFrom:\'\',dateTo:\'\',phase:\'\',priority:\'\',light:\'\',type:\'\',worksite:\'\'};renderApp()">Limpar</button></div></div>';
  }
  function fmtClockMs(ms){
    ms=Math.max(0,Number(ms||0));
    const totalSeconds=Math.floor(ms/1000),days=Math.floor(totalSeconds/86400),hours=Math.floor((totalSeconds%86400)/3600),minutes=Math.floor((totalSeconds%3600)/60),seconds=totalSeconds%60;
    const hh=String(hours).padStart(2,'0'),mm=String(minutes).padStart(2,'0'),ss=String(seconds).padStart(2,'0');
    return days?days+'d '+hh+':'+mm+':'+ss:hh+':'+mm+':'+ss;
  }
  function orderClockTotalMs(o){
    migrateOrder(o);
    const times=o.phaseTimes||{};
    let total=Object.values(times).reduce((sum,value)=>sum+Math.max(0,Number(value)||0),0);
    if(o.phaseStartedAt&&o.phaseCurrent&&!isFinal(o)){
      total+=Math.max(0,Date.now()-new Date(o.phaseStartedAt).getTime());
    }
    return total>0?total:totalMs(o);
  }
  function phaseClockRows(list){
    const pickupOrders=(list||[]).filter(o=>o.fulfillmentType!=='entrega_obra');
    return PICKUP.filter(status=>!['Retirado/Entregue','Cancelado'].includes(status)).map((status,index)=>{
      const key='pickup:'+status;
      const values=pickupOrders.map(o=>phaseMs(o,key)).filter(value=>value>0);
      const total=values.reduce((sum,value)=>sum+value,0);
      return {index,key,label:status,count:values.length,totalMs:total,avgMs:values.length?total/values.length:0};
    });
  }
  function phaseClockBars(rows){
    const max=Math.max(1,...rows.map(row=>row.avgMs||0));
    return '<div class="phase-clock-chart" id="phaseClockChart">'+rows.map(row=>{
      const width=row.avgMs?Math.max(3,Math.min(100,(row.avgMs/max)*100)):0;
      const avg=row.count?fmtClockMs(row.avgMs):'00:00:00';
      const detail=row.count?row.count+' pedido'+(row.count===1?'':'s')+' medido'+(row.count===1?'':'s')+' • total '+fmtClockMs(row.totalMs):'Sem medição registrada';
      return '<div class="phase-clock-row '+(row.count?'':'empty-clock')+'" data-phase-index="'+row.index+'">'+
        '<div class="phase-clock-label">'+esc(row.label)+'</div>'+
        '<div class="phase-clock-track"><div class="phase-clock-fill" style="width:'+width.toFixed(2)+'%"></div></div>'+
        '<div class="phase-clock-value"><strong>'+avg+'</strong><span>'+detail+'</span></div>'+
      '</div>';
    }).join('')+'<div class="phase-clock-note">Os valores usam os cronômetros acumulados em cada fase e incluem o tempo da etapa atual em andamento.</div></div>';
  }
  function refreshDashboardPhaseClocks(){
    if(typeof activeTab==='undefined'||activeTab!=='dashboard')return;
    const root=document.getElementById('phaseClockChart');
    if(!root)return;
    const rows=phaseClockRows(dashboardFiltered());
    const max=Math.max(1,...rows.map(row=>row.avgMs||0));
    rows.forEach(row=>{
      const el=root.querySelector('[data-phase-index="'+row.index+'"]');
      if(!el)return;
      const fill=el.querySelector('.phase-clock-fill');
      const strong=el.querySelector('.phase-clock-value strong');
      const span=el.querySelector('.phase-clock-value span');
      const width=row.avgMs?Math.max(3,Math.min(100,(row.avgMs/max)*100)):0;
      if(fill)fill.style.width=width.toFixed(2)+'%';
      if(strong)strong.textContent=row.count?fmtClockMs(row.avgMs):'00:00:00';
      if(span)span.textContent=row.count?row.count+' pedido'+(row.count===1?'':'s')+' medido'+(row.count===1?'':'s')+' • total '+fmtClockMs(row.totalMs):'Sem medição registrada';
      el.classList.toggle('empty-clock',!row.count);
    });
    const slaEl=document.querySelector('[data-dashboard-sla-clock]');

    try{
      if(!currentUser)return;
      migrateAll();
      loadCart();
      const allowed=currentUser.role==='admin'
        ? ['estoque','kanban','dashboard','base','agenda','config','editor']
        : ['catalogo','meusPedidos','contato','estoque','kanban','config'];
      if(!allowed.includes(activeTab))activeTab=currentUser.role==='admin'?'estoque':'catalogo';
      renderTop();
      if(currentUser.role==='admin')renderAdmin();else renderRequester();
    }catch(error){
      console.error('Erro ao renderizar o ObraStock:',error);
      try{toast('O aplicativo se recuperou de um erro de navegação.')}catch(e){}
    }
  };

  setTimeout(renderApp,0);
})();

</script>

      route: '<svg '+common+'><path d="M6 18.5a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6ZM18 9.1a1.8 1.8 0 1 0 0-3.6 1.8 1.8 0 0 0 0 3.6Z"/><path d="M7.8 16.8c1.3-4 5.2-2.3 6.6-5.2"/><path d="M15.8 10.9l-1.4.7.6 1.4"/></svg>',
      checkcircle: '<svg '+common+'><circle cx="12" cy="12" r="8"/><path d="M8.8 12.1l2.1 2.2 4.3-4.6"/></svg>'
    };
    return icons[kind] || icons.inbox;
  }
  function iconKind(title){
    const t=(title||'').toLowerCase();
    if(t.includes('anális')) return 'searchdoc';
    if(t.includes('programad')) return 'calendar';
    if(t.includes('separad')) return 'box';
    if(t.includes('cancel')) return 'xcircle';
    if(t.includes('em rota')) return 'route';

  if(typeof originalRenderApp === 'function'){

      setTimeout(applyKanbanColumnIcons, 0);
      return result;

  const originalRenderAdmin = window.renderAdmin;

<script>
/* Integração Marketplace -> Aplicativo principal -> Fretes / Formulário */
(function(){
  const originalAddCart = window.addCart;
  const originalToggleDeliveryFields = window.toggleDeliveryFields;

  function safeStore(key, value){
    const serialized=JSON.stringify(value);
    try{
      if(typeof storageSet==='function') return storageSet(key,serialized);
      localStorage.setItem(key,serialized);
      return true;
    }catch(e){
      try{ MEMORY_STORAGE[key]=serialized; return true; }catch(ignore){ return false; }
    }
  }

  function deliveryDraft(itemId){
    const item = typeof getItem === 'function' ? getItem(itemId) : null;
    const qty = Math.max(1, Number(document.getElementById('rqQty')?.value || 1));
    const desiredDate = document.getElementById('rqDate')?.value || (typeof nowDate === 'function' ? nowDate() : '');
    const note = (document.getElementById('rqNote')?.value || '').trim();
    const deliveryAddress = (document.getElementById('rqDeliveryAddress')?.value || '').trim();
    const requester = window.currentUser || currentUser || {};
    return {
      source: 'ObraStock Marketplace',
      sourceModule: 'marketplace',
      targetModule: 'fretes',
      targetTab: 'formulario',
      action: 'nova_solicitacao_frete',
      createdAt: new Date().toISOString(),
      requester: {
        name: requester.name || requester.nome || '',
        email: requester.email || requester.mail || '',
        phone: requester.phone || requester.telefone || '',
        worksite: requester.worksite || requester.obra || ''
      },
      movementType: 'Entrega de materiais do Marketplace',
      origin: typeof SEEL_SEDE_ADDRESS !== 'undefined' ? SEEL_SEDE_ADDRESS : 'Sede SEEL',
      destination: deliveryAddress,
      desiredDate,
      notes: note,
      materials: [{
        itemId,
        code: item?.code || '',
        description: item?.name || 'Material do Marketplace',
        quantity: qty,
        unit: item?.unit || 'unidade',
        category: item?.category || ''
      }],
      routeUrl: typeof gmapsRoute === 'function' ? gmapsRoute(typeof SEEL_SEDE_ADDRESS !== 'undefined' ? SEEL_SEDE_ADDRESS : 'Sede SEEL', deliveryAddress) : ''
    };
  }

  function clickByText(root, terms){
    if(!root) return false;
    const nodes = root.querySelectorAll('button,a,[role="tab"],[data-module],[data-app],[data-page],[data-target]');
    for(const node of nodes){
      const txt = (node.textContent || '').trim().toLowerCase();
      const attrs = [node.getAttribute('data-module'),node.getAttribute('data-app'),node.getAttribute('data-page'),node.getAttribute('data-target'),node.id].filter(Boolean).join(' ').toLowerCase();
      if(terms.some(term => txt === term || txt.includes(term) || attrs.includes(term))){
        try{ node.click(); return true; }catch(e){}
      }
    }
    return false;
  }

  function clickFormTabInDocument(doc){
    if(!doc) return false;
    if(clickByText(doc, ['formulário','formulario','nova solicitação','nova solicitacao'])) return true;
    const frames = doc.querySelectorAll('iframe');
    for(const frame of frames){
      try{
        const frameDoc = frame.contentDocument || frame.contentWindow?.document;
        if(frameDoc && clickByText(frameDoc, ['formulário','formulario','nova solicitação','nova solicitacao'])) return true;
      }catch(e){}
    }
    return false;
  }

  function invokeParentHooks(payload){
    let invoked = false;
    try{
      const p = window.parent;
      if(p && p !== window){
        const hooks = ['openModule','navigateToModule','openApp','navigateTo','selectModule','activateModule'];
        for(const name of hooks){
          if(typeof p[name] === 'function'){
            try{
              if(name === 'openApp') p[name]('fretes',{tab:'formulario',payload});
              else p[name]('fretes','formulario',payload);
              invoked = true;
              break;
            }catch(e){}
          }
        }
      }
    }catch(e){}
    return invoked;
  }

  function navigateParentDom(){
    try{
      const parentDoc = window.parent && window.parent !== window ? window.parent.document : null;
      if(!parentDoc) return false;
      const moduleClicked = clickByText(parentDoc, ['fretes','gestão de fretes','gestao de fretes']);
      if(moduleClicked){
        let attempts = 0;
        const timer = setInterval(function(){
          attempts += 1;
          if(clickFormTabInDocument(parentDoc) || attempts >= 20) clearInterval(timer);
        },150);
      }
      return moduleClicked;
    }catch(e){ return false; }
  }

  function openFretesForm(payload){
    safeStore('seel_fretes_form_draft', payload);
    safeStore('supply_flow_fretes_draft', payload);
    safeStore('fretes_form_draft', payload);

    const messages = [
      {type:'SEEL_OPEN_MODULE',module:'fretes',tab:'formulario',payload},
      {type:'SUPPLY_FLOW_NAVIGATE',module:'fretes',tab:'formulario',payload},
      {type:'OPEN_APP_MODULE',module:'fretes',tab:'formulario',payload},
      {type:'FRETES_NEW_REQUEST',tab:'formulario',payload}
    ];
    for(const msg of messages){
      try{ window.dispatchEvent(new CustomEvent(msg.type,{detail:msg})); }catch(e){}
      try{ window.parent?.postMessage(msg,'*'); }catch(e){}
      try{ if(window.top && window.top !== window.parent) window.top.postMessage(msg,'*'); }catch(e){}
    }

    const hookUsed = invokeParentHooks(payload);
    const domUsed = navigateParentDom();

    if(hookUsed || domUsed){
      try{ window.parent?.postMessage({type:'SEEL_FRETES_DRAFT_READY',payload},'*'); }catch(e){}
      if(typeof toast === 'function') toast('Abrindo Fretes > Formulário...');
    }else{
      try{ window.location.hash = 'fretes/formulario'; }catch(e){}
      if(typeof toast === 'function') toast('Não foi possível abrir o módulo de Fretes automaticamente. Acesse o módulo Fretes e crie a solicitação de entrega manualmente com os dados informados aqui.');
    }
  }

  function updateDeliveryAction(){
    const type = document.querySelector('input[name="fulfillmentType"]:checked')?.value || 'retirada_sede';
    const modal = document.querySelector('.modal');
    if(!modal) return;
    const actionButton = Array.from(modal.querySelectorAll('button')).find(btn => (btn.getAttribute('onclick') || '').includes('addCart('));
    if(actionButton){
      const desiredText = type === 'entrega_obra' ? 'Continuar no formulário de Fretes' : 'Adicionar ao carrinho';
      if(actionButton.textContent !== desiredText) actionButton.textContent = desiredText;
      actionButton.classList.toggle('btn-green', type === 'entrega_obra');
      actionButton.classList.toggle('btn-primary', type !== 'entrega_obra');
    }
    const descs = modal.querySelectorAll('.fulfillment-desc');
    const desiredDesc = 'A solicitação será continuada no módulo de Fretes do aplicativo principal.';
    if(descs[1] && descs[1].textContent !== desiredDesc) descs[1].textContent = desiredDesc;
  }

  window.toggleDeliveryFields = function(){
    if(typeof originalToggleDeliveryFields === 'function') originalToggleDeliveryFields.apply(this, arguments);
    setTimeout(updateDeliveryAction,0);
  };

  window.addCart = async function(itemId){
    const type = document.querySelector('input[name="fulfillmentType"]:checked')?.value || 'retirada_sede';
    if(type !== 'entrega_obra'){
      return typeof originalAddCart === 'function' ? originalAddCart.apply(this, arguments) : undefined;
    }
    const item = typeof getItem === 'function' ? getItem(itemId) : null;
    if(!item || item.active === false || Number(item.qty) <= 0){
      if(typeof toast === 'function') toast('Item indisponível.');
      return;
    }
    const qty = Math.max(1, Number(document.getElementById('rqQty')?.value || 1));
    if(qty > Number(item.qty)){
      if(typeof toast === 'function') toast('Quantidade acima do estoque disponível.');
      return;
    }
    const address = (document.getElementById('rqDeliveryAddress')?.value || '').trim();
    if(!address){
      if(typeof toast === 'function') toast('Informe o endereço da obra.');
      return;
    }
    const payload = deliveryDraft(itemId);
    try{ if(typeof closeModal === 'function') closeModal(); }catch(e){}
    openFretesForm(payload);
  };

  const observer = new MutationObserver(function(){ updateDeliveryAction(); });
  observer.observe(document.body,{childList:true,subtree:true});
})();
</script>

@media(max-width:720px){.mk-slide-grid{padding:18px 16px 10px}.mk-slide h1{font-size:clamp(22px,7vw,30px)}.mk-hero-actions{flex-direction:column}.mk-btn-main,.mk-btn-ghost{width:100%}.mk-hero-stats{grid-template-columns:1fr 1fr}.mk-product-grid{grid-template-columns:1fr 1fr}.mk-flow-grid{grid-template-columns:1fr}.mk-flow-arrow{height:24px;width:3px;justify-self:center}.mk-flow-arrow:after{right:50%;top:auto;bottom:-2px;transform:translateX(50%);border-left:6px solid transparent;border-right:6px solid transparent;border-top:8px solid #3483fa;border-bottom:none}.mk-hero-bottom{padding:0 16px 14px;align-items:flex-start}.mk-hero-note{order:3;text-align:left}.mk-stage{min-height:0}.mk-stage-title{font-size:19px}.mk-bar-row{grid-template-columns:72px 1fr 28px}}
</style>

<script>
/* Hero do marketplace com 3 slides automáticos e manuais — visual comercial */
(function(){
  const heroState={index:0,timer:null};
  const heroSlides=[
    {
      visualType:'catalog',
      kicker:'Marketplace interno SEEL',
      title:'Peça materiais para a obra em poucos cliques.',
      desc:'Busque o item, escolha a quantidade e envie a solicitação direto pelo catálogo.',
      pills:['Catálogo organizado','Pedido rápido','Retirada ou entrega'],
      ctaPrimary:'Ver materiais',
      ctaSecondary:'Meus pedidos',
      primaryAction:"window.scrollTo({top:(document.querySelector('.section')?.offsetTop||0)-110,behavior:'smooth'})",
      secondaryAction:"activeTab='meusPedidos';renderApp()",
      badge:'1 de 3',
      stageEyebrow:'Destaques do catálogo',
      stageTitle:'Itens frequentes para agilizar a solicitação.'
    },
    {
      visualType:'flow',
      kicker:'Fluxo de atendimento',
      title:'Retirada fica aqui. Entrega segue para Fretes.',
      desc:'Pedidos com entrega são encaminhados para o módulo de Fretes. Retiradas continuam no Kanban do marketplace.',
      pills:['Sem retrabalho','Fluxo integrado','Dados reaproveitados'],
      ctaPrimary:'Ver Kanban',
      ctaSecondary:'Abrir fretes',
      primaryAction:"activeTab='kanban';renderApp()",
      secondaryAction:"window.location.hash='fretes-formulario'",
      badge:'2 de 3',
      stageEyebrow:'Como funciona',
      stageTitle:'Cada pedido segue o caminho correto sem duplicar informação.'
    },
    {
      visualType:'dashboard',
      kicker:'Controle operacional',
      title:'Acompanhe estoque, pedidos e SLA em um só lugar.',
      desc:'Tenha visão rápida dos itens em atenção e do andamento do processo.',
      pills:['Estoque crítico','Pedidos em aberto','SLA por fase'],
      ctaPrimary:'Abrir dashboard',
      ctaSecondary:'Ir para estoque',
      primaryAction:"activeTab='dashboard';renderApp()",
      secondaryAction:"activeTab='estoque';renderApp()",
      badge:'3 de 3',
      stageEyebrow:'Painel da operação',
      stageTitle:'Indicadores objetivos para apoiar a gestão do almoxarifado.'
    }
  ];

  function heroMetrics(){
    const activeItems=(state.items||[]).filter(i=>i.active!==false);
    const categories=new Set(activeItems.map(i=>i.category).filter(Boolean));
    const lowStock=activeItems.filter(i=>Number(i.qty||0)<=Number(i.min||0)).length;
    const openOrders=(state.orders||[]).filter(o=>{const status=o&&o.fulfillmentType==='entrega_obra'?(o.deliveryStatus||o.status):o&&o.status;return !['Retirado/Entregue','Cancelado','Entregue'].includes(status)}).length;
    const urgentOrders=(state.orders||[]).filter(o=>String(o.priority||'').toLowerCase().includes('urg')).length;
    return {activeItems:activeItems.length,categories:categories.size,lowStock,openOrders,urgentOrders};
  }

  function stageMarkup(type,m){
    if(type==='catalog') return `
      <div class="mk-search-box"><i>⌕</i><span>Buscar material, código ou categoria</span></div>
      <div class="mk-product-grid">
        <div class="mk-product-card"><div class="mk-product-icon">🦺</div><strong>EPI</strong><span>Capacete, luvas, óculos e itens de segurança.</span></div>
        <div class="mk-product-card"><div class="mk-product-icon">🛠️</div><strong>Ferramentas</strong><span>Chaves, discos e materiais de manutenção.</span></div>
        <div class="mk-product-card"><div class="mk-product-icon">💡</div><strong>Elétrica</strong><span>Cabos, conectores e materiais de instalação.</span></div>
      </div>
      <div class="mk-chip-row"><span class="mk-chip">Solicitação rápida</span><span class="mk-chip">Mais usados</span></div>`;
    if(type==='flow') return `
      <div class="mk-flow-grid">
        <div class="mk-flow-card"><span class="mk-flow-pill">Retirada</span><strong>Kanban do marketplace</strong><span>Separação, atendimento e baixa do estoque seguem aqui.</span></div>
        <div class="mk-flow-arrow"></div>
        <div class="mk-flow-card"><span class="mk-flow-pill">Entrega</span><strong>Módulo de Fretes</strong><span>Os dados do pedido são enviados para o formulário do aplicativo principal.</span></div>
      </div>
      <div class="mk-chip-row"><span class="mk-chip">Integração direta</span><span class="mk-chip">Sem digitação duplicada</span></div>`;
    return `
      <div class="mk-mini-stack">
        <div class="mk-metric-card"><div><small>Pedidos em aberto</small><strong>${m.openOrders}</strong></div><span class="mk-flow-pill">Operação</span></div>
        <div class="mk-metric-card"><div><small>Estoque crítico</small><strong>${m.lowStock}</strong></div><span class="mk-flow-pill">Atenção</span></div>
        <div class="mk-bar-list">
          <div class="mk-bar-row"><span>Ativos</span><div class="mk-bar"><i style="width:${Math.min(100,20 + m.activeItems)}%"></i></div><b>${m.activeItems}</b></div>
          <div class="mk-bar-row"><span>Categorias</span><div class="mk-bar"><i style="width:${Math.min(100,18 + m.categories*10)}%"></i></div><b>${m.categories}</b></div>
          <div class="mk-bar-row"><span>Urgentes</span><div class="mk-bar"><i style="width:${Math.min(100,10 + m.urgentOrders*12)}%"></i></div><b>${m.urgentOrders}</b></div>
        </div>
      </div>`;
  }

  window.marketplaceHeroHTML=function(){
    const m=heroMetrics();
    return `<section class="mk-hero"><div class="mk-hero-track">${heroSlides.map((slide,idx)=>`<article class="mk-slide ${idx===0?'active':''}" data-mk-slide="${idx}"><div class="mk-slide-grid"><div class="mk-slide-main"><span class="mk-kicker">${slide.kicker}</span><h1>${slide.title}</h1><p>${slide.desc}</p><div class="mk-hero-pills">${slide.pills.map(p=>`<span class="mk-hero-pill">${p}</span>`).join('')}</div><div class="mk-hero-actions"><button class="mk-btn-main" onclick="${slide.primaryAction}">${slide.ctaPrimary}</button><button class="mk-btn-ghost" onclick="${slide.secondaryAction}">${slide.ctaSecondary}</button></div><div class="mk-hero-stats"><div class="mk-stat"><strong>${m.activeItems}</strong><span>Itens ativos</span></div><div class="mk-stat"><strong>${m.categories}</strong><span>Categorias</span></div><div class="mk-stat"><strong>${m.openOrders}</strong><span>Pedidos em aberto</span></div></div></div><aside class="mk-visual"><div class="mk-stage"><div class="mk-stage-top"><div class="mk-stage-eyebrow">${slide.stageEyebrow}</div><span class="mk-stage-badge">${slide.badge}</span></div><h3 class="mk-stage-title">${slide.stageTitle}</h3>${stageMarkup(slide.visualType,m)}</div></aside></div></article>`).join('')}</div><div class="mk-hero-bottom"><div class="mk-dots">${heroSlides.map((_,idx)=>`<button class="mk-dot ${idx===0?'active':''}" data-mk-dot="${idx}" onclick="goMarketplaceSlide(${idx})" aria-label="Ir para slide ${idx+1}"></button>`).join('')}</div><div class="mk-hero-note">Destaques do marketplace com rotação automática e navegação manual.</div><div class="mk-arrows"><button class="mk-arrow" onclick="changeMarketplaceSlide(-1)" aria-label="Slide anterior">‹</button><button class="mk-arrow" onclick="changeMarketplaceSlide(1)" aria-label="Próximo slide">›</button></div></div></section>`;
  };

  function updateHero(){
    document.querySelectorAll('[data-mk-slide]').forEach((el,i)=>el.classList.toggle('active',i===heroState.index));
    document.querySelectorAll('[data-mk-dot]').forEach((el,i)=>el.classList.toggle('active',i===heroState.index));
  }
  function resetTimer(){
    if(heroState.timer) clearInterval(heroState.timer);
    heroState.timer=setInterval(()=>{heroState.index=(heroState.index+1)%heroSlides.length;updateHero();},5600);
  }
  window.goMarketplaceSlide=function(index){heroState.index=(index+heroSlides.length)%heroSlides.length;updateHero();resetTimer();};
  window.changeMarketplaceSlide=function(step){heroState.index=(heroState.index+step+heroSlides.length)%heroSlides.length;updateHero();resetTimer();};
  window.stopMarketplaceHeroSlider=function(){if(heroState.timer){clearInterval(heroState.timer);heroState.timer=null;}};
  window.initMarketplaceHeroSlider=function(){if(!document.querySelector('.mk-hero')){window.stopMarketplaceHeroSlider();return;}updateHero();resetTimer();};

  const previousRenderRequester=window.renderRequester || renderRequester;
  window.renderRequester = renderRequester = function(){
    previousRenderRequester();
    if(activeTab==='catalogo') setTimeout(()=>{try{initMarketplaceHeroSlider()}catch(e){console.error(e)}},0);
    else window.stopMarketplaceHeroSlider();
  };
})();
</script>


<script id="obrastock-final-stability">
/* Camada final de estabilidade e validação funcional */
(function(){
  function byId(id){return document.getElementById(id)}
  function safeText(value){return String(value==null?'':value)}

  window.nextOrderNumber=function(){
    const max=(state.orders||[]).reduce((acc,o)=>{
      const match=String(o&&o.number||'').match(/(\d+)$/);
      return Math.max(acc,match?Number(match[1]):0);
    },0);
    return 'PED-'+String(max+1).padStart(4,'0');
  };

  function sanitizeState(){
    if(!state||typeof state!=='object')state={items:[],orders:[],settings:{}};
    if(!Array.isArray(state.items))state.items=[];
    if(!Array.isArray(state.orders))state.orders=[];
    state.settings=Object.assign({email:'almoxarifado@seel.com.br',whatsapp:'5521999999999',message:'Olá, preciso falar sobre uma solicitação de materiais.'},state.settings||{});
    state.items=state.items.filter(Boolean).map((item,index)=>({
      id:item.id==null?Date.now()+index:item.id,
      name:safeText(item.name||'Material sem nome'),
      code:safeText(item.code||('ITEM-'+String(index+1).padStart(3,'0'))),
      category:safeText(item.category||'Sem categoria'),
      unit:safeText(item.unit||'unidade'),
      qty:Math.max(0,Number(item.qty||0)),
      min:Math.max(0,Number(item.min||0)),
      location:safeText(item.location||'Sede'),
      emoji:safeText(item.emoji||'📦'),
      image:safeText(item.image||''),
      active:item.active!==false
    }));
    state.orders=state.orders.filter(Boolean).map(o=>{
      o.items=Array.isArray(o.items)?o.items:[];
      if(o.status==='Retirado/Entregue'&&o.withdrawalDateTime&&o.stockAdjusted==null)o.stockAdjusted=true;
      return o;
    });
  }

  filteredItems=window.filteredItems=function(){
    const q=(byId('globalSearch')?.value||'').trim().toLowerCase();
    return (state.items||[]).filter(i=>i.active!==false&&(!q||[i.name,i.code,i.category,i.location].some(v=>safeText(v).toLowerCase().includes(q))));
  };

  estoque=window.estoque=function(){
    const q=safeText(adminSearch).trim().toLowerCase();
    const items=(state.items||[]).filter(i=>!q||[i.name,i.code,i.category,i.location].some(v=>safeText(v).toLowerCase().includes(q)));
    return `<div class="section-head"><div><h2>Controle de estoque</h2><div class="muted">Cadastre imagens, quantidades e disponibilidade.</div></div><button class="btn-primary" onclick="openItem()">Cadastrar item</button></div><div class="table-wrap"><table><thead><tr><th>Imagem</th><th>Item</th><th>Código</th><th>Categoria</th><th>Qtd.</th><th>Mín.</th><th>Local</th><th>Status</th><th>Ações</th></tr></thead><tbody>${items.map(i=>`<tr><td>${i.image?`<img class="thumb" src="${esc(i.image)}" alt="${esc(i.name)}">`:`<div class="thumb">${i.emoji||'📦'}</div>`}</td><td><b>${esc(i.name)}</b></td><td>${esc(i.code)}</td><td>${esc(i.category)}</td><td class="${Number(i.qty)<=Number(i.min)?'danger':''}">${Number(i.qty)} ${esc(i.unit)}</td><td>${Number(i.min)}</td><td>${esc(i.location||'-')}</td><td>${i.active!==false?'Ativo':'Inativo'}</td><td><button class="btn-light" onclick="openItem(${JSON.stringify(i.id)})">Editar</button> <button class="btn-light" onclick="quickQty(${JSON.stringify(i.id)})">Qtd.</button></td></tr>`).join('')}</tbody></table></div>`;
  };

  saveItem=window.saveItem=function(id){
    const name=(byId('itName')?.value||'').trim();
    const code=(byId('itCode')?.value||'').trim();
    const category=(byId('itCat')?.value||'').trim();
    if(!name||!code||!category)return toast('Preencha nome, código e categoria.');
    const duplicate=(state.items||[]).find(i=>safeText(i.code).toLowerCase()===code.toLowerCase()&&String(i.id)!==String(id));
    if(duplicate)return toast('Já existe um item com esse código.');
    const obj={
      id:id==null?Date.now():id,
      name,code,category,
      unit:(byId('itUnit')?.value||'unidade').trim()||'unidade',
      qty:Math.max(0,Number(byId('itQty')?.value||0)),
      min:Math.max(0,Number(byId('itMin')?.value||0)),
      location:(byId('itLoc')?.value||'Sede').trim()||'Sede',
      emoji:(byId('itEmoji')?.value||'📦').trim()||'📦',
      image:(byId('itImage')?.value||'').trim(),
      active:(byId('itActive')?.value||'true')==='true'
    };
    const idx=(state.items||[]).findIndex(x=>String(x.id)===String(obj.id));
    if(idx>=0)state.items[idx]=obj;else state.items.unshift(obj);
    saveState();closeModal();renderApp();toast('Item salvo.');
  };

  quickQty=window.quickQty=function(id){
    const item=getItem(id);if(!item)return toast('Item não encontrado.');
    openModal(`<div class="modal-head"><div><h2>Atualizar quantidade</h2><div class="muted">${esc(item.name)}</div></div><button class="btn-light" onclick="closeModal()">Fechar</button></div><div class="field"><label>Quantidade</label><input id="newQty" type="number" min="0" value="${Number(item.qty||0)}"></div><button class="btn-primary" onclick="updateQuickQty(${JSON.stringify(item.id)})">Atualizar</button>`);
  };
  window.updateQuickQty=function(id){
    const item=getItem(id);if(!item)return toast('Item não encontrado.');
    item.qty=Math.max(0,Number(byId('newQty')?.value||0));
    saveState();closeModal();renderApp();toast('Quantidade atualizada.');
  };

  window.saveMarketplaceSettings=function(){
    state.settings.email=(byId('cfgEmail')?.value||'').trim();
    state.settings.whatsapp=(byId('cfgWhats')?.value||'').replace(/\D/g,'');
    state.settings.message=(byId('cfgMsg')?.value||'').trim();
    if(state.settings.email&&!state.settings.email.includes('@'))return toast('Informe um e-mail válido.');
    saveState();renderApp();toast('Configurações salvas.');
  };
  config=window.config=function(){
    const s=state.settings||{};
    return `<h2>Configurações</h2><div class="panel"><div class="row-2"><div class="field"><label>E-mail</label><input id="cfgEmail" value="${esc(s.email||'')}"></div><div class="field"><label>WhatsApp</label><input id="cfgWhats" value="${esc(s.whatsapp||'')}"></div></div><div class="field"><label>Mensagem padrão</label><textarea id="cfgMsg">${esc(s.message||'')}</textarea></div><button class="btn-primary" onclick="saveMarketplaceSettings()">Salvar</button></div>`;
  };

  function searchSettings(isAdmin){
    const rerender=isAdmin?'renderAdmin()':'renderRequester()';
    if(activeTab==='catalogo')return {placeholder:'Buscar materiais, EPIs, limpeza...',value:'',action:'renderRequester()',disabled:false};
    if(activeTab==='estoque')return {placeholder:'Buscar item, código, categoria ou local',value:safeText(adminSearch),action:`adminSearch=this.value;${rerender}`,disabled:false};
    if(activeTab==='kanban')return {placeholder:'Buscar pedido, solicitante, obra ou material',value:safeText(window.mpKanbanFilters?.search||''),action:`mpKanbanFilters.search=this.value;${rerender}`,disabled:false};
    if(activeTab==='dashboard'||activeTab==='base')return {placeholder:'Buscar pedido, solicitante ou obra',value:safeText(window.mpDashboardFilters?.search||''),action:`mpDashboardFilters.search=this.value;${rerender}`,disabled:false};
    return {placeholder:'Pesquisa disponível no Marketplace, Estoque, Kanban e Dashboard',value:'',action:'',disabled:true};
  }

  renderTop=window.renderTop=function(){
    const top=byId('topArea');if(!top)return;
    const isAdmin=currentUser?.role==='admin';
    const operational=['estoque','kanban','config','dashboard','base','agenda','editor'].includes(activeTab);
    const search=searchSettings(isAdmin);
    const categoryStrip=(!isAdmin&&activeTab==='catalogo')?topCategoryStrip():'';
    const requesterActions=(!isAdmin&&!operational)?`<button class="btn-light" onclick="activeTab='meusPedidos';renderApp()">Meus pedidos</button><button class="btn-primary" onclick="toggleCart(true)">Carrinho <span class="badge">${cart.length}</span></button>`:'';
    top.innerHTML=`<div class="topbar"><div class="topbar-inner"><div class="brand">${COMPANY_LOGO?`<img src="${COMPANY_LOGO}" alt="SEEL">`:''}<span>ObraStock<small>${isAdmin?'Admin':'Marketplace interno'}</small></span></div><div class="search"><input id="globalSearch" value="${esc(search.value)}" placeholder="${esc(search.placeholder)}" ${search.disabled?'disabled':''} ${search.action?`oninput="${search.action}"`:''}><button ${search.disabled?'disabled':''} onclick="document.getElementById('globalSearch')?.focus()">⌕</button></div><div class="top-actions">${requesterActions}</div></div></div>${categoryStrip}<div class="nav"><div class="nav-inner">${isAdmin?adminTabs():requesterTabs()}</div></div>`;
  };

  function finalKanbanIcon(kind){
    const common='viewBox="0 0 24 24" aria-hidden="true"';
    const icons={
      inbox:`<svg ${common}><path d="M4 5.5h16v10.5H4z"/><path d="M4 13h4l2 2h4l2-2h4"/><path d="M8 18.5h8"/></svg>`,
      search:`<svg ${common}><path d="M8 4.5h6l3 3v10.5H8z"/><path d="M14 4.5v3h3"/><circle cx="10.5" cy="14" r="2.5"/><path d="M12.4 15.9l1.8 1.8"/></svg>`,
      calendar:`<svg ${common}><rect x="4" y="6.5" width="16" height="13" rx="2"/><path d="M8 4.5v4M16 4.5v4M4 10.5h16"/><path d="M9 14h2M13 14h2M9 17h6"/></svg>`,
      box:`<svg ${common}><path d="M12 3.8l7 3.7-7 3.7-7-3.7z"/><path d="M5 8.2v7.3l7 4 7-4V8.2"/><path d="M12 11.2v8.2"/></svg>`,
      check:`<svg ${common}><circle cx="12" cy="12" r="8"/><path d="M8.8 12.1l2.1 2.2 4.3-4.6"/></svg>`,
      cancel:`<svg ${common}><circle cx="12" cy="12" r="8"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>`
    };
    return icons[kind]||icons.inbox;
  }
  function applyFinalKanbanIcons(){
    document.querySelectorAll('.kanban-premium-colhead').forEach(head=>{
      const title=safeText(head.querySelector('.kanban-premium-title')?.textContent).toLowerCase();
      const box=head.querySelector('.kanban-premium-ic');if(!box)return;
      let kind='inbox';
      if(title.includes('anális'))kind='search';else if(title.includes('program'))kind='calendar';else if(title.includes('separ'))kind='box';else if(title.includes('retirado')||title.includes('entregue'))kind='check';else if(title.includes('cancel'))kind='cancel';
      box.innerHTML=finalKanbanIcon(kind);
    });
  }

  renderRequester=window.renderRequester=function(){
    const main=byId('mainArea');if(!main)return;
    if(activeTab!=='catalogo'&&typeof window.stopMarketplaceHeroSlider==='function')window.stopMarketplaceHeroSlider();
    if(activeTab==='catalogo')main.innerHTML=catalogo();
    else if(activeTab==='meusPedidos')main.innerHTML=meusPedidos();
    else if(activeTab==='estoque')main.innerHTML='<main class="admin-main">'+estoque()+'</main>';
    else if(activeTab==='kanban')main.innerHTML='<main class="admin-main">'+kanbanPedidosComAbas()+'</main>';
    else if(activeTab==='dashboard')main.innerHTML='<main class="admin-main">'+marketplaceDashboard()+'</main>';
    else if(activeTab==='config')main.innerHTML='<main class="admin-main">'+config()+'</main>';
    else if(activeTab==='contato')main.innerHTML=contato();
    else{activeTab='catalogo';main.innerHTML=catalogo();}
    if(activeTab==='catalogo'&&typeof window.initMarketplaceHeroSlider==='function')setTimeout(window.initMarketplaceHeroSlider,0);
    if(activeTab==='kanban')setTimeout(applyFinalKanbanIcons,0);
  };

  renderAdmin=window.renderAdmin=function(){
    const main=byId('mainArea');if(!main)return;
    let content='';
    if(activeTab==='estoque')content=estoque();
    else if(activeTab==='kanban')content=kanbanPedidosComAbas();
    else if(activeTab==='dashboard')content=marketplaceDashboard();
    else if(activeTab==='base')content=marketplaceBase();
    else if(activeTab==='agenda')content=agenda();
    else if(activeTab==='config')content=config();
    else if(activeTab==='editor')content=marketplaceEditor();
    else{activeTab='estoque';content=estoque();}
    main.innerHTML='<main class="admin-main">'+content+'</main>';
    if(activeTab==='kanban')setTimeout(applyFinalKanbanIcons,0);
  };

  renderApp=window.renderApp=function(){
    try{
      if(!currentUser)currentUser=typeof resolveInitialSession==='function'?resolveInitialSession():{email:'solicitante@seel.com.br',name:'Solicitante',role:'requester'};
      sanitizeState();
      loadCart();
      if(typeof migrateAll==='function')migrateAll();
      const allowed=currentUser.role==='admin'?['estoque','kanban','dashboard','base','agenda','config','editor']:['catalogo','meusPedidos','estoque','kanban','dashboard','config','contato'];
      if(!allowed.includes(activeTab))activeTab=currentUser.role==='admin'?'estoque':'catalogo';
      renderTop();
      if(currentUser.role==='admin')renderAdmin();else renderRequester();
    }catch(error){
      console.error('Erro ao renderizar o ObraStock:',error);
      const main=byId('mainArea');
      if(main)main.innerHTML='<main class="admin-main"><div class="panel"><h2>Não foi possível carregar esta tela</h2><p class="muted">A navegação foi restaurada. Tente abrir a aba novamente.</p><button class="btn-primary" onclick="activeTab=currentUser?.role===\'admin\'?\'estoque\':\'catalogo\';renderApp()">Voltar ao início</button></div></main>';
      try{toast('O aplicativo se recuperou de um erro de navegação.')}catch(ignore){}
    }
  };

  function validateOrderStock(order){
    for(const row of order.items||[]){
      const item=getItem(row.itemId);
      if(!item||item.active===false)return {ok:false,message:'Um item do pedido não está mais disponível.'};
      if(Number(item.qty||0)<Number(row.qty||0))return {ok:false,message:'Estoque insuficiente para concluir a baixa de '+item.name+'.'};
    }
    return {ok:true};
  }
  function adjustPickupStock(order,newStatus){
    if(!order||order.fulfillmentType==='entrega_obra')return true;
    const goingDelivered=newStatus==='Retirado/Entregue';
    if(goingDelivered&&!order.stockAdjusted){
      const check=validateOrderStock(order);if(!check.ok){toast(check.message);return false;}
      (order.items||[]).forEach(row=>{const item=getItem(row.itemId);item.qty=Math.max(0,Number(item.qty||0)-Number(row.qty||0));});
      order.stockAdjusted=true;order.stockAdjustedAt=new Date().toISOString();
    }else if(!goingDelivered&&order.stockAdjusted){
      (order.items||[]).forEach(row=>{const item=getItem(row.itemId);if(item)item.qty=Number(item.qty||0)+Number(row.qty||0);});
      order.stockAdjusted=false;order.stockAdjustedAt='';
      order.withdrawalDateTime='';order.withdrawnBy='';order.withdrawalPhoto='';
    }
    if(!['Retirado/Entregue','Cancelado'].includes(newStatus))order.completedAt='';
    return true;
  }

  const previousPickupPhase=window.mpSetPickupPhase;
  if(typeof previousPickupPhase==='function'){
    window.mpSetPickupPhase=function(id,status){
      const order=getOrder(id);if(!order)return toast('Pedido não encontrado.');
      if(!adjustPickupStock(order,status))return;
      const result=previousPickupPhase.call(this,id,status);
      if(!['Retirado/Entregue','Cancelado'].includes(status))order.completedAt='';
      saveState();return result;
    };
  }

  const previousSaveOrder=window.saveOrder;
  if(typeof previousSaveOrder==='function'){
    saveOrder=window.saveOrder=function(id){
      const order=getOrder(id);if(!order)return toast('Pedido não encontrado.');
      const newStatus=byId('oStatus')?.value||order.status||'Solicitado';
      if(!adjustPickupStock(order,newStatus))return;
      const result=previousSaveOrder.call(this,id);
      if(!['Retirado/Entregue','Cancelado'].includes(newStatus))order.completedAt='';
      saveState();return result;
    };
  }

  const previousConfirmSubmit=window.confirmSubmitOrder;
  if(typeof previousConfirmSubmit==='function'){
    confirmSubmitOrder=window.confirmSubmitOrder=function(){
      loadCart();
      if(!cart.length)return toast('O carrinho está vazio.');
      if(cart.some(row=>normalizeCart(row).fulfillmentType==='entrega_obra'))return toast('As entregas devem ser continuadas no formulário do módulo de Fretes.');
      for(const row of cart){
        const normalized=normalizeCart(row),item=getItem(normalized.itemId);
        if(!item||item.active===false||Number(item.qty||0)<Number(normalized.qty||0))return toast('Revise o carrinho: há item indisponível ou com saldo insuficiente.');
      }
      return previousConfirmSubmit.apply(this,arguments);
    };
  }

  confirmDeliver=window.confirmDeliver=function(id){
    const order=getOrder(id);if(!order)return toast('Pedido não encontrado.');
    const dateTime=byId('wdDateTime')?.value||'';
    const responsible=(byId('wdBy')?.value||'').trim();
    const file=byId('wdPhoto')?.files?.[0];
    if(!dateTime)return toast('Informe data e hora.');
    if(!responsible)return toast('Informe o responsável.');
    if(!file)return toast('Anexe uma foto.');
    const reader=new FileReader();
    reader.onload=function(){
      order.withdrawalDateTime=dateTime;order.withdrawnBy=responsible;order.withdrawalPhoto=reader.result;
      if(typeof window.mpSetPickupPhase==='function')window.mpSetPickupPhase(id,'Retirado/Entregue');
      saveState();closeModal();renderApp();toast('Baixa realizada com sucesso.');
    };
    reader.onerror=function(){toast('Não foi possível ler a foto anexada.');};
    reader.readAsDataURL(file);
  };

  window.addEventListener('storage',function(event){
    if(event.key===STORAGE_KEY||event.key===CART_KEY){
      try{state=loadState();loadCart();renderApp();}catch(error){console.error(error)}
    }
  });

  setTimeout(function(){try{renderApp()}catch(error){console.error(error)}},0);
})();
</script>

<script>
/* Caixa maior para inserir foto */
(function(){
  window.triggerPhotoInput = function(){
    var inp=document.getElementById('wdPhoto');
    if(inp) inp.click();
  };

  window.bindPhotoUploadBox = function(){
    var inp=document.getElementById('wdPhoto');
    var preview=document.getElementById('wdPhotoPreview');
    var hint=document.getElementById('wdPhotoHint');
    if(!inp || !preview || !hint) return;
    inp.onchange=function(){
      var file=inp.files && inp.files[0];
      if(!file){
        preview.innerHTML='';
        preview.classList.remove('has-image');
        hint.textContent='Clique para selecionar a foto';
        return;
      }
      hint.textContent=file.name;
      var reader=new FileReader();
      reader.onload=function(e){
        preview.innerHTML='<img src="'+e.target.result+'" alt="Pré-visualização da foto">';
        preview.classList.add('has-image');
      };
      reader.readAsDataURL(file);
    };
  };

  window.deliver = function(id){
    const o=getOrder(id);
    if(!o)return;
    if(o.status==='Retirado/Entregue') return toast('Pedido já concluído.');
    openModal(`<div class="modal-head"><div><h2>${o.fulfillmentType==='entrega_obra'?'Confirmar entrega':'Confirmar retirada'}</h2><div class="muted">${esc(o.number)}</div></div><button class="btn-light" onclick="closeModal()">Fechar</button></div><div class="row-2"><div class="field"><label>Data e hora</label><input id="wdDateTime" type="datetime-local" value="${nowLocal()}"></div><div class="field"><label>${o.fulfillmentType==='entrega_obra'?'Responsável pelo recebimento':'Quem retirou'}</label><input id="wdBy"></div></div><div class="field"><label>Foto obrigatória</label><input id="wdPhoto" type="file" accept="image/*" style="display:none"><div class="photo-upload-box" onclick="triggerPhotoInput()"><div id="wdPhotoPreview" class="photo-upload-preview"></div><div class="photo-upload-content"><strong>Adicionar foto</strong><span id="wdPhotoHint">Clique para selecionar a foto</span></div></div></div><div class="panel"><b>Itens que serão baixados:</b><ul>${(o.items||[]).map(c=>{const i=getItem(c.itemId)||{name:'Item removido',unit:''};return `<li>${esc(i.name)} — ${c.qty} ${esc(i.unit||'')}</li>`}).join('')}</ul></div><button class="btn-green" style="width:100%" onclick="confirmDeliver(${o.id})">Confirmar baixa</button>`);
    setTimeout(bindPhotoUploadBox, 0);
  };

  setTimeout(function(){ try{ renderApp(); }catch(e){ console.error(e); } }, 0);
})();
</script>

<script>
/* Substitui emojis/amarelos por ícones profissionais neutros */
(function(){
  window.itemVisualIcon = function(item){
    const text=((item&&item.category)||'')+' '+((item&&item.name)||'');
    const t=text.toLowerCase();
    if(/epi|capacete|luva|óculos|oculos|bota|uniforme/.test(t)) return monoIcon('safety','sm');
    if(/ferrament|chave|disco|martelo|furadeira|serra/.test(t)) return monoIcon('tools','sm');
    if(/eletric|cabo|tomada|lamp|lâmp|led|disjuntor/.test(t)) return monoIcon('electric','sm');
    if(/hidraul|tubo|registro|conex|mangueira/.test(t)) return monoIcon('drop','sm');
    if(/tinta|pintura|rolo|pincel/.test(t)) return monoIcon('tag','sm');
    if(/limpeza|detergente|desengrax|sabão|sabonete/.test(t)) return monoIcon('box','sm');
    if(/parafuso|porca|arruela|aço|aco|metal/.test(t)) return monoIcon('tools','sm');
    if(/cimento|argamassa|brita|areia|bloco/.test(t)) return monoIcon('construction','sm');
    return monoIcon('box','sm');
  };
  setTimeout(function(){ try{ renderApp(); }catch(e){ console.error(e); } }, 0);
})();
</script>
<style>
.card-icon-badge,
.placeholder,
.mk-product-icon,
.icon-chip{
  background:#f6f8fb !important;
}
.placeholder-icon .ui-ico,
.card-icon-badge .ui-ico,
.card-icon-badge.clean .ui-ico{
  color:#466173 !important;
}
</style>
