project_id = "supply-flow-seel"

[auth]
site_url = "https://supply-flow.seeleng.app"
additional_redirect_urls = [
  "https://supply-flow.seeleng.app/**",
  "https://supply-flow-seel-theta.vercel.app/**",
  "https://supply-flow-seel.vercel.app/**",
  "https://*.vercel.app/**",
  "https://edusant0s.github.io/**",
  "http://localhost:5173/**",
  "http://127.0.0.1:5173/**",
]

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m0s"
otp_length = 8
otp_expiry = 3600

[storage.vector]
enabled = false
max_buckets = 10
max_indexes = 5

[functions.create-user]
verify_jwt = false

[functions.manage-user]
verify_jwt = false
